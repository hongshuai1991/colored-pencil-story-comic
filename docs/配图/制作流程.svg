<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="574" viewBox="0 0 1440 574" role="img" aria-labelledby="title"><title id="title">彩铅手绘漫画的五阶段制作流程与确认节点</title><defs><marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#94a68c" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="572" rx="20" fill="#ffffff" stroke="#dde3d8"/><text x="54" y="68" font-size="35" fill="#30362c" font-weight="700">从一段故事，到一组连续漫画</text><text x="54" y="110" font-size="23" fill="#757c70" font-weight="400">先确定本篇人物和代表性试图，再继续授权范围内的页面。</text><rect x="54" y="155" width="250" height="267" rx="16" fill="white" stroke="#dde3d8"/><rect x="73" y="175" width="48" height="36" rx="8" fill="#eef4e7" stroke="#eef4e7"/><text x="82" y="201" font-size="23" fill="#536b42" font-weight="700">01</text><text x="73" y="254" font-size="28" fill="#30362c" font-weight="700">故事与分镜</text><text x="73" y="298" font-size="21" fill="#757c70" font-weight="400">最终文案与人物关系</text><text x="73" y="331" font-size="21" fill="#757c70" font-weight="400">动作、构图、连续性</text><rect x="73" y="372" width="210" height="30" rx="6" fill="#eef2eb" stroke="#eef2eb"/><text x="84" y="394" font-size="19" fill="#607354" font-weight="550">核对故事</text><path d="M308 280H318" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><rect x="324" y="155" width="250" height="267" rx="16" fill="white" stroke="#dde3d8"/><rect x="343" y="175" width="48" height="36" rx="8" fill="#eef4e7" stroke="#eef4e7"/><text x="352" y="201" font-size="23" fill="#536b42" font-weight="700">02</text><text x="343" y="254" font-size="28" fill="#30362c" font-weight="700">人物定稿</text><text x="343" y="298" font-size="21" fill="#757c70" font-weight="400">人物档案与多视角</text><text x="343" y="331" font-size="21" fill="#757c70" font-weight="400">必要时补身高对照</text><rect x="343" y="372" width="210" height="30" rx="6" fill="#f7eedf" stroke="#f7eedf"/><text x="354" y="394" font-size="19" fill="#907043" font-weight="550">需要确认</text><path d="M578 280H588" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><rect x="594" y="155" width="250" height="267" rx="16" fill="white" stroke="#dde3d8"/><rect x="613" y="175" width="48" height="36" rx="8" fill="#eef4e7" stroke="#eef4e7"/><text x="622" y="201" font-size="23" fill="#536b42" font-weight="700">03</text><text x="613" y="254" font-size="28" fill="#30362c" font-weight="700">少量试图</text><text x="613" y="298" font-size="21" fill="#757c70" font-weight="400">脸部、全身服装</text><text x="613" y="331" font-size="21" fill="#757c70" font-weight="400">故事中的互动动作</text><rect x="613" y="372" width="210" height="30" rx="6" fill="#f7eedf" stroke="#f7eedf"/><text x="624" y="394" font-size="19" fill="#907043" font-weight="550">需要确认</text><path d="M848 280H858" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><rect x="864" y="155" width="250" height="267" rx="16" fill="white" stroke="#dde3d8"/><rect x="883" y="175" width="48" height="36" rx="8" fill="#eef4e7" stroke="#eef4e7"/><text x="892" y="201" font-size="23" fill="#536b42" font-weight="700">04</text><text x="883" y="254" font-size="28" fill="#30362c" font-weight="700">连续制作</text><text x="883" y="298" font-size="21" fill="#757c70" font-weight="400">每页携带角色定稿</text><text x="883" y="331" font-size="21" fill="#757c70" font-weight="400">沿用当前服装版本</text><rect x="883" y="372" width="210" height="30" rx="6" fill="#eef2eb" stroke="#eef2eb"/><text x="894" y="394" font-size="19" fill="#607354" font-weight="550">按授权推进</text><path d="M1118 280H1128" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><rect x="1134" y="155" width="250" height="267" rx="16" fill="white" stroke="#dde3d8"/><rect x="1153" y="175" width="48" height="36" rx="8" fill="#eef4e7" stroke="#eef4e7"/><text x="1162" y="201" font-size="23" fill="#536b42" font-weight="700">05</text><text x="1153" y="254" font-size="28" fill="#30362c" font-weight="700">整组检查</text><text x="1153" y="298" font-size="21" fill="#757c70" font-weight="400">并排查看全部页面</text><text x="1153" y="331" font-size="21" fill="#757c70" font-weight="400">修正偏差与结构问题</text><rect x="1153" y="372" width="210" height="30" rx="6" fill="#eef2eb" stroke="#eef2eb"/><text x="1164" y="394" font-size="19" fill="#607354" font-weight="550">交付成果</text><rect x="54" y="457" width="1330" height="83" rx="12" fill="#f6f8f2" stroke="#f6f8f2"/><text x="78" y="491" font-size="23" fill="#596a50" font-weight="500">已有本篇定稿角色时直接沿用。确认人物与试图后，按你授权的范围继续制作。</text><text x="78" y="525" font-size="23" fill="#596a50" font-weight="500">本轮只做文字或人物时，交付到对应阶段。</text></g></svg>