<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="title"><title id="title">本篇角色定稿同时约束每页，上一页只辅助连续性</title><defs><marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#94a68c" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="888" rx="20" fill="#ffffff" stroke="#dde3d8"/><text x="60" y="68" font-size="35" fill="#30362c" font-weight="700">每一页，都回到本篇角色定稿</text><text x="60" y="110" font-size="23" fill="#757c70" font-weight="400">身份、发型、体型与当前服装，作为持续使用的绘制依据。</text><rect x="430" y="153" width="580" height="147" rx="15" fill="#eff5e9" stroke="#cbd9bf"/><text x="460" y="198" font-size="30" fill="#4f693e" font-weight="700">本篇角色定稿  C01</text><text x="460" y="240" font-size="24" fill="#30362c" font-weight="400">多视角参考＋具体外貌描述</text><text x="460" y="276" font-size="24" fill="#30362c" font-weight="400">当前服装版本 V1</text><path d="M720 302V347H275V414" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><path d="M720 302V414" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><path d="M720 302V347H1165V414" fill="none" stroke="#94a68c" stroke-width="2.5" stroke-dasharray="" marker-end="url(#arr)"/><rect x="80" y="434" width="390" height="233" rx="16" fill="white" stroke="#dde3d8"/><text x="105" y="480" font-size="27" fill="#30362c" font-weight="700">第01页</text><text x="105" y="521" font-size="23" fill="#7f99ad" font-weight="550">中景 · 两人互动</text><text x="105" y="577" font-size="22" fill="#757c70" font-weight="400">C01 定稿＋V1 服装</text><text x="105" y="613" font-size="22" fill="#757c70" font-weight="400">保留脸型、发型和体型</text><path d="M473 549H515" fill="none" stroke="#7f99ad" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="525" y="434" width="390" height="233" rx="16" fill="white" stroke="#dde3d8"/><text x="550" y="480" font-size="27" fill="#30362c" font-weight="700">第02页</text><text x="550" y="521" font-size="23" fill="#7f99ad" font-weight="550">手部与手机特写</text><text x="550" y="577" font-size="22" fill="#757c70" font-weight="400">C01 定稿＋V1 服装</text><text x="550" y="613" font-size="22" fill="#757c70" font-weight="400">保留袖口、道具与动作</text><path d="M918 549H960" fill="none" stroke="#7f99ad" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr)"/><rect x="970" y="434" width="390" height="233" rx="16" fill="white" stroke="#dde3d8"/><text x="995" y="480" font-size="27" fill="#30362c" font-weight="700">第03页</text><text x="995" y="521" font-size="23" fill="#7f99ad" font-weight="550">双人中景</text><text x="995" y="577" font-size="22" fill="#757c70" font-weight="400">C01 定稿＋V1 服装</text><text x="995" y="613" font-size="22" fill="#757c70" font-weight="400">保留相对身高和场景</text><text x="102" y="710" font-size="23" fill="#757c70" font-weight="400">上一页提供动作与道具衔接；角色身份持续从本篇定稿读取。</text><rect x="80" y="756" width="1280" height="91" rx="13" fill="#f6f0e6" stroke="#eadfcd"/><text x="105" y="793" font-size="25" fill="#8f6d40" font-weight="600">剧情换装时，建立新状态并注明生效页。</text><text x="105" y="828" font-size="22" fill="#757c70" font-weight="400">例如：第01—07页沿用 V1；从第08页起使用 V2，其余未改变的特征继续固定。</text></g></svg>