<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="990" viewBox="0 0 1440 990" role="img" aria-labelledby="title"><title id="title">3:4 页面中的文字、插画位置、安全区与成稿检查</title><defs><marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#94a68c" stroke-width="1.5"/></marker></defs><g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"><rect x="1" y="1" width="1438" height="988" rx="20" fill="#ffffff" stroke="#dde3d8"/><text x="60" y="68" font-size="35" fill="#30362c" font-weight="700">一页怎样容纳文字与插画</text><text x="60" y="110" font-size="23" fill="#757c70" font-weight="400">以第01页为例，示意默认 3:4 页面与可编辑文字的分工。</text><rect x="60" y="156" width="540" height="720" rx="12" fill="white" stroke="#cfd8c8"/><text x="101" y="228" font-size="34" fill="#30362c" font-weight="500">妈妈把手机递过来。</text><text x="101" y="285" font-size="34" fill="#30362c" font-weight="500">妈妈：「按哪里，</text><text x="101" y="342" font-size="34" fill="#30362c" font-weight="500">才能把声音发给你？」</text><rect x="99" y="435" width="462" height="353" rx="15" fill="#f6f8f1" stroke="#d6dfce"/><rect x="255" y="480" width="112" height="178" rx="12" fill="#fff" stroke="#59674b"/><rect x="269" y="499" width="84" height="124" rx="4" fill="#e9f0df" stroke="#dce6ce"/><circle cx="311" cy="641" r="5" fill="none" stroke="#59674b" stroke-width="2"/><text x="205" y="706" font-size="27" fill="#6d8359" font-weight="600">插画位置示意</text><text x="148" y="748" font-size="23" fill="#757c70" font-weight="400">妈妈拿着手机，女儿靠近屏幕。</text><text x="88" y="849" font-size="18" fill="#757c70" font-weight="400">第01页 · 排版示意</text><text x="674" y="192" font-size="28" fill="#607b4b" font-weight="700">01  叙述与对白</text><text x="674" y="241" font-size="23" fill="#757c70" font-weight="400">使用本页已确认的最终文字，</text><text x="674" y="277" font-size="23" fill="#757c70" font-weight="400">保留可编辑正文。</text><text x="674" y="370" font-size="28" fill="#607b4b" font-weight="700">02  单幅主要场景</text><text x="674" y="419" font-size="23" fill="#757c70" font-weight="400">插画呈现当页动作、表情和关系，</text><text x="674" y="455" font-size="23" fill="#757c70" font-weight="400">场景保留充足白底。</text><text x="674" y="548" font-size="28" fill="#607b4b" font-weight="700">03  文字安全区</text><text x="674" y="597" font-size="23" fill="#757c70" font-weight="400">按内容调整图文位置，</text><text x="674" y="633" font-size="23" fill="#757c70" font-weight="400">完整露出脸部、关键动作和道具。</text><text x="674" y="726" font-size="28" fill="#607b4b" font-weight="700">04  成稿检查</text><text x="674" y="775" font-size="23" fill="#757c70" font-weight="400">核对错字、漏字、对白归属和换行，</text><text x="674" y="811" font-size="23" fill="#757c70" font-weight="400">整组检查角色、服装与笔触。</text><text x="60" y="937" font-size="25" fill="#30362c" font-weight="600">制作时保留三类成果：无字插画、可编辑文案、加字成稿。</text></g></svg>